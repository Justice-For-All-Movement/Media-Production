name: Engine checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pam
          POSTGRES_PASSWORD: pam
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pam"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://pam:pam@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check Ubuntu archive source layouts
        run: python3 scripts/test-ci-ubuntu-archive.py
      - name: Use canonical HTTPS Ubuntu archive for large tool downloads
        run: sudo python3 scripts/ci-ubuntu-archive.py
      - name: Install media tools
        run: sudo ./scripts/install-tools.sh
      - run: npm ci
      - name: Install Playwright Chromium (interactive play-through test)
        run: npm install --no-save playwright@1.52.0 && npx playwright install --with-deps chromium
      - run: npm run check

  consent-http:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/checkout@v4
        with:
          repository: Justice-For-All-Movement/Consent-rights-and-use-decisions-engine
          ref: be8bf8cdaf333b5278027663eeffaf4a36b6f08a
          path: .engines/consent
          persist-credentials: false
      - run: npm ci
        working-directory: .engines/consent
      - name: Install private image integration tools
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=600 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 update
          sudo apt-get -o DPkg::Lock::Timeout=600 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 install -y --no-install-recommends librsvg2-bin imagemagick libimage-exiftool-perl fonts-dejavu-core zip
      - name: Check asset-byte permissions on real owning PostgreSQL
        run: node --test tests/asset-byte-permission.test.ts tests/worker-asset-bytes.test.ts tests/worker-asset-permissions.test.ts tests/worker-completion-permissions.test.ts tests/worker-authorization.test.ts tests/worker-completion-authorization.test.ts tests/worker-project-permissions.test.ts tests/worker-project-basis.test.ts tests/worker-recorded-blocks.test.ts tests/worker-storage-errors.test.ts tests/worker-source-storage-errors.test.ts
        env:
          TEST_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/postgres
      - run: npm run test:consent
        env:
          E11_DIR: ${{ github.workspace }}/.engines/consent
          TEST_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/postgres
      - name: Build and install private package for the same actual E11 chain
        run: |
          npm run build
          artifact=$(npm pack --pack-destination "$RUNNER_TEMP" --json | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s)[0].filename));')
          mkdir -p "$RUNNER_TEMP/media-read-consumer"
          cd "$RUNNER_TEMP/media-read-consumer"
          npm init -y
          npm install "$RUNNER_TEMP/$artifact"
      - name: Run actual E11 chain through installed public engine export
        run: npm run test:consent
        env:
          E11_DIR: ${{ github.workspace }}/.engines/consent
          TEST_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/postgres
          MEDIA_PACKAGE_ROOT: ${{ runner.temp }}/media-read-consumer
      - name: Check asset-byte permissions through installed public engine
        run: node --test tests/asset-byte-permission.test.ts tests/worker-asset-bytes.test.ts tests/worker-asset-permissions.test.ts tests/worker-completion-permissions.test.ts tests/worker-authorization.test.ts tests/worker-completion-authorization.test.ts tests/worker-project-permissions.test.ts tests/worker-project-basis.test.ts tests/worker-recorded-blocks.test.ts tests/worker-storage-errors.test.ts tests/worker-source-storage-errors.test.ts
        env:
          TEST_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/postgres
          MEDIA_PACKAGE_ROOT: ${{ runner.temp }}/media-read-consumer
